# Smart-профили SQUAD VPN.
# Каждый профиль превращается в подписку: <name>, <name>.b64, <name>.yaml
# и доступен как /sub?profile=<name>. Файл перечитывается без перезапуска.
#
# Поля (все, кроме name, необязательные):
#   description          — подпись в панели
#   min_score            — минимальный quality score, 0..100
#   min_stability        — минимальный stability score, 0..100
#   max_latency          — максимальный ping (медиана последних проверок), мс
#   checked_within_hours — узел проверялся не раньше, чем N часов назад
#   seen_within_hours    — узел был в источниках не раньше, чем N часов назад
#   limit                — максимум узлов в подписке
#   countries            — только эти страны выхода, например [DE, NL]
#   exclude_countries    — исключить страны выхода
#   protocols            — только эти протоколы: vless, vmess, trojan, ss, hysteria2
#   per_host             — сколько узлов с одного сервера (null = без ограничения)
#   per_exit_ip          — сколько узлов с одним IP выхода (null = без ограничения)
#   max_asn_share        — максимальная доля одного провайдера (ASN), 0..1
#   require_regions      — только узлы, живые по проверке пробников из этих
#                          стран за последние 24 часа, например [RU]
#   avoid_blocked_in     — убрать узлы, которые пробники из этих стран видят
#                          мёртвыми, хотя из других стран они живые
#   require_tls          — только узлы с маскировкой под HTTPS (VLESS
#                          Reality/TLS, Trojan, VMess+TLS, Hysteria2); голый
#                          Shadowsocks и VMess/VLESS без TLS в России режет DPI
#   min_checks           — минимум успешных проверок (одна удачная — не в счёт)
#   prefer_regions       — узлы, подтверждённые пробниками из этих стран, первыми
#   deprioritize_asns    — эти сети выхода (ASN) ставить в конец списка
#   prefer_tags          — узлы из источников с этими тегами (sources.yaml) первыми
#   min_speed_kbps       — убрать узлы, скорость которых измерена ниже, кбит/с
#   sort_by              — score (по умолчанию) или speed (по скорости загрузки)
#   whitelist            — только узлы из коллекций «под белые списки»
#   require_alive        — false: не требовать нашу проверку (см. whitelist)
#   aliases              — другие имена файлов с теми же узлами, чтобы старые
#                          ссылки на удалённые подписки продолжали работать
#
# Узлы с выходом в России не помогают обходить блокировки, поэтому основные
# профили их исключают.

# Хостинги, к которым в России часто режут соединения после первых ~16 КБ.
# Узлы в этих сетях не убираются, а ставятся в конец списка.
x-throttled: &throttled
  - AS13335   # Cloudflare
  - AS24940   # Hetzner
  - AS16276   # OVH
  - AS14061   # DigitalOcean
  - AS63949   # Akamai / Linode
  - AS20473   # Vultr
  - AS16509   # Amazon
  - AS14618   # Amazon
  - AS396982  # Google Cloud
  - AS8075    # Microsoft
  - AS31898   # Oracle
  - AS12876   # Scaleway
  - AS51167   # Contabo

# Подписки по странам и протоколам (country/*, protocol/*) не публикуются:
# хватает трёх подписок ниже.
groups: false

profiles:
  # Главная подписка: 10 самых надёжных узлов с маскировкой под HTTPS.
  - name: top
    description: 10 самых надёжных — начни с неё
    min_score: 75
    min_stability: 80
    min_checks: 4
    max_latency: 400
    limit: 10
    require_tls: true
    protocols: [vless, trojan, hysteria2]
    exclude_countries: [RU]
    avoid_blocked_in: [RU]
    prefer_regions: [RU]
    prefer_tags: [ru-checked]
    min_speed_kbps: 2000
    deprioritize_asns: *throttled
    max_asn_share: 0.2

  # 300 лучших: только проверенные несколько раз подряд, с маскировкой под
  # HTTPS, от 1 Мбит/с, по одному узлу на сервер и IP выхода, не больше 20 %
  # от одного провайдера. Заменяет прежние balanced, fast, stable, europe,
  # russia и all: их ссылки отдают эти же узлы.
  - name: best
    description: 300 лучших узлов
    min_score: 70
    min_stability: 60
    min_checks: 3
    max_latency: 500
    limit: 300
    require_tls: true
    exclude_countries: [RU]
    avoid_blocked_in: [RU]
    prefer_regions: [RU]
    prefer_tags: [ru-checked]
    min_speed_kbps: 1000
    deprioritize_asns: *throttled
    max_asn_share: 0.2
    aliases: [all, balanced, fast, stable, europe, russia]

  # Режим «белых списков»: когда мобильный интернет урезают до разрешённых
  # сайтов. Только узлы из коллекций «под белые списки» (теги whitelist в
  # sources.yaml), которые их автор проверяет из России. Наша проверка из-за
  # границы для них не обязательна: такие серверы часто не отвечают чужим.
  - name: whitelist
    description: Белые списки — когда глушат мобильный интернет
    whitelist: true
    require_alive: false
    require_tls: true
    seen_within_hours: 2
    exclude_countries: [RU]
    limit: 100
    # Серверов под белые списки мало (~40), поэтому до 3 конфигов на сервер:
    # разные порты и транспорты, если один перекроют, сработает другой.
    per_host: 3
    per_exit_ip: null
    max_asn_share: null
