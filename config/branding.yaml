# Как подписки SQUAD VPN выглядят у пользователя в VPN-приложении
# (Happ, Hiddify, v2RayTun, INCY, Streisand, Clash Verge, …).
#
# Правь прямо на GitHub (карандаш «Edit» вверху файла → «Commit changes»).
# Через час подписки обновятся сами, а приложения пользователей подтянут
# новое название при следующем обновлении подписки.
#
# В тексте можно использовать подстановки:
#   {brand}        — название бренда ниже
#   {name}         — id подписки (top, balanced, …)
#   {description}  — описание профиля из config/profiles.yaml
#   {count}        — сколько узлов сейчас в подписке (только в announce)

# Бренд: подставляется вместо {brand}.
brand: SQUAD VPN

# Название подписки в приложении — то, что видно после добавления ссылки.
title: "{brand}"

# Описание под названием (Happ, v2RayTun, INCY и др.). Пусто — не показывать.
announce: "Бесплатная подписка VPN от Сквада."

# Как часто приложение само обновляет подписку, в часах.
update_interval_hours: 1

# Кнопка «Поддержка» и ссылка на сайт в приложении. Пусто — не показывать.
support_url: ""
web_page_url: "https://github.com/JEFFRIPPER/SQUAD_VPN"

# Названия узлов в списке приложения. Подстановки: {flag} {country} {code}
# {n} (номер в стране) {protocol} {brand}. Пусто ("") — оставить названия
# из источников как есть.
node_name: "{flag} {country} {n}"

# Своё название и описание для отдельных подписок (перекрывают общие).
# Сейчас у всех подписок одно название и описание. Пример, если понадобится:
#   top:
#     title: "{brand} · Топ-10"
#     announce: "10 самых надёжных узлов."
profiles:
  whitelist:
    title: "{brand} · Белые списки"
    announce: "Для режима белых списков, когда глушат мобильный интернет. Обнови подписку заранее, пока интернет работает."
