[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squad-vpn"
version = "1.1.0"
description = "SQUAD VPN multi-source aggregator, validator, smart subscriptions, API and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "qrcode>=7.4,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
squad-vpn = "squad_vpn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squad_vpn = ["dashboard/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
