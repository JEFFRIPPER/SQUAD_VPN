name: Build desktop app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Создать релиз с этим тегом (например v1.0.0); пусто — только app-latest"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller pywebview pillow

      - name: Draw icon
        run: python app/make_icon.py

      # The exe knows its own build, so the app can tell when a newer one
      # was downloaded over the air and offer to restart into it.
      - name: Stamp build version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/squad_vpn/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $build = "$version-$("${{ github.sha }}".Substring(0, 7))"
          "VERSION = `"$build`"" | Out-File -Encoding ascii app/build_info.py
          Get-Content app/build_info.py

      - name: Build SQUAD-VPN.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SQUAD-VPN --icon app/icon.ico
          --collect-all webview
          app/launcher.py

      - name: Check the exe and write the OTA manifest
        shell: pwsh
        run: |
          $exe = Get-Item dist/SQUAD-VPN.exe
          if ($exe.Length -lt 1MB) { throw "exe is too small: $($exe.Length)" }
          "{0:N1} MB" -f ($exe.Length / 1MB)
          $version = (Select-String -Path src/squad_vpn/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $build = "$version-$("${{ github.sha }}".Substring(0, 7))"
          $build | Out-File -Encoding ascii -NoNewline dist/app-version.txt
          $sha = (Get-FileHash dist/SQUAD-VPN.exe -Algorithm SHA256).Hash.ToLower()
          @{ version = $build; sha256 = $sha; size = $exe.Length; commit = "${{ github.sha }}" } |
            ConvertTo-Json | Out-File -Encoding ascii dist/app-manifest.json
          Get-Content dist/app-manifest.json

      - name: Publish release app-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view app-latest -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create app-latest -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest=false `
              --title "SQUAD VPN — приложение для Windows" `
              --notes "Скачай SQUAD-VPN.exe и запусти: на новом компьютере он сам установит SQUAD VPN (Python, всё нужное, автозапуск, ярлык). На уже установленном — это панель управления; обновляется сама."
          }
          gh release edit app-latest -R $env:GITHUB_REPOSITORY `
            --notes "Скачай SQUAD-VPN.exe и запусти: на новом компьютере он сам установит SQUAD VPN (Python, всё нужное, автозапуск, ярлык). На уже установленном — это панель управления; обновляется сама."
          gh release upload app-latest dist/SQUAD-VPN.exe dist/app-version.txt dist/app-manifest.json -R $env:GITHUB_REPOSITORY --clobber
          $global:LASTEXITCODE = 0

      # A version tag (v1.0.0 …) also gets its own release with the exe.
      - name: Publish versioned release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release view $env:TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            # --target creates the tag on this commit when it does not exist yet.
            gh release create $env:TAG dist/SQUAD-VPN.exe -R $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA --title "SQUAD VPN $env:TAG" --notes-file CHANGELOG.md --latest
          } else {
            gh release upload $env:TAG dist/SQUAD-VPN.exe -R $env:GITHUB_REPOSITORY --clobber
          }
          $global:LASTEXITCODE = 0
