name: Update subscriptions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      # The database carries node history between runs (scores, jitter, stability).
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/squad_vpn.sqlite3
          key: squad-db-${{ github.run_id }}
          restore-keys: squad-db-

      - name: Collect, validate, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUAD_PUBLISH_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: >-
          python -m squad_vpn run
          --publish --publish-branch subs
          --limit 400 --validation-concurrency 32 --geo-limit 40
          --strict

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/squad_vpn.sqlite3
          key: squad-db-${{ github.run_id }}
