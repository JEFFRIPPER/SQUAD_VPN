name: Create APK signing key

# One-off, started by hand: creates the apk signing key inside GitHub and
# stores it straight into repository secrets: the keystore (base64) split into
# SQUAD_KEYSTORE_1..4 and its password SQUAD_KEYSTORE_PASSWORD. The key never
# appears in the repo, in the logs or anywhere else. The keystore is split
# because GitHub never starts a job that references one secret this large
# (seen 2026-10-05 with a 5.7 KB secret). Secrets can only be written with a
# token: put one with access to this repo's secrets into the secret
# SQUAD_SECRETS_TOKEN first.
#
# A new key means apps signed with the old one will not update over: every
# phone has to remove the app and install it again once.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Напиши NEW-KEY: после нового ключа apk на всех телефонах придётся один раз переустановить"
        required: true
      replace:
        description: "Заменить уже созданный ключ (ещё одна переустановка на всех телефонах)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: apk-signing-key
  cancel-in-progress: false

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create the key and store it in repository secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          REPLACE: ${{ inputs.replace }}
          GH_TOKEN: ${{ secrets.SQUAD_SECRETS_TOKEN }}
          EXISTING_KEY: ${{ secrets.SQUAD_KEYSTORE_1 }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$CONFIRM" != "NEW-KEY" ]; then
            echo "::error::Не подтверждено: в поле confirm нужно написать NEW-KEY"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Нет секрета SQUAD_SECRETS_TOKEN (токен с доступом к секретам этого репозитория)"
            exit 1
          fi
          if [ -n "$EXISTING_KEY" ] && [ "$REPLACE" != "true" ]; then
            echo "::error::Ключ уже есть в секретах. Чтобы заменить его, запусти ещё раз с галочкой replace"
            exit 1
          fi

          pass=$(openssl rand -hex 32)
          echo "::add-mask::$pass"
          store="$RUNNER_TEMP/squad.p12"
          keytool -genkeypair -keystore "$store" -storetype PKCS12 -alias squad \
            -keyalg EC -groupname secp256r1 -validity 36500 \
            -storepass "$pass" -keypass "$pass" -dname "CN=SQUAD VPN, O=SQUAD, C=RU" > /dev/null

          base64 -w0 "$store" > "$RUNNER_TEMP/squad.b64"
          split -n 4 -d -a 1 "$RUNNER_TEMP/squad.b64" "$RUNNER_TEMP/part"
          for i in 0 1 2 3; do
            gh secret set "SQUAD_KEYSTORE_$((i + 1))" -R "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/part$i"
          done
          printf '%s' "$pass" | gh secret set SQUAD_KEYSTORE_PASSWORD -R "$GITHUB_REPOSITORY"
          # Left over from the first attempt, which kept the keystore in one secret.
          gh secret delete SQUAD_KEYSTORE_B64 -R "$GITHUB_REPOSITORY" 2> /dev/null || true

          # The certificate fingerprint is public: it lets anyone check which key signed an apk.
          fingerprint=$(keytool -list -v -keystore "$store" -storepass "$pass" -alias squad \
            | awk -F': ' '/SHA256:/ {print $2; exit}')
          rm -f "$store" "$RUNNER_TEMP/squad.b64" "$RUNNER_TEMP"/part?
          {
            echo "### Новый ключ подписи apk записан в секреты"
            echo
            echo "SHA-256 сертификата: \`$fingerprint\`"
            echo
            echo "Секрет SQUAD_SECRETS_TOKEN больше не нужен, его и сам токен можно удалить."
          } >> "$GITHUB_STEP_SUMMARY"
