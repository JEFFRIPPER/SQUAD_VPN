mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
proxies:
- name: SQUAD BR 001 vmess 8dc5b5
  type: vmess
  server: 89.39.161.157
  port: 443
  uuid: 03fcc618-b93d-6796-6aed-8a38c975d581
  alterId: 0
  cipher: auto
  udp: true
  tls: true
  servername: aksai.org
  network: ws
  ws-opts:
    path: /linkvws
    headers:
      Host: aksai.org
proxy-groups:
- name: SQUAD
  type: select
  proxies:
  - AUTO
  - FAILOVER
  - SQUAD BR 001 vmess 8dc5b5
- name: AUTO
  type: url-test
  proxies: &id001
  - SQUAD BR 001 vmess 8dc5b5
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
- name: FAILOVER
  type: fallback
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 120
  lazy: true
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- MATCH,SQUAD
