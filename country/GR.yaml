mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
proxies:
- name: SQUAD GR 001 vless 1afe4e
  type: vless
  server: 185.126.238.87
  port: 2083
  uuid: 7668f678-faee-40cc-9b56-9c39dc773388
  udp: true
  encryption: none
  network: grpc
  grpc-opts:
    grpc-service-name: security.debian.org
proxy-groups:
- name: SQUAD
  type: select
  proxies:
  - AUTO
  - FAILOVER
  - SQUAD GR 001 vless 1afe4e
- name: AUTO
  type: url-test
  proxies: &id001
  - SQUAD GR 001 vless 1afe4e
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
- name: FAILOVER
  type: fallback
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 120
  lazy: true
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- MATCH,SQUAD
