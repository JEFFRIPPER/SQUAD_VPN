mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
proxies:
- name: SQUAD LV 001 vless ca826e
  type: vless
  server: 87.192.47.10
  port: 52006
  uuid: bc659d88-a1e0-4c65-a49a-7b51b26a7a7f
  udp: true
  encryption: none
  flow: xtls-rprx-vision
  tls: true
  servername: grok.setlisting.ru
  alpn:
  - h2
  - http/1.1
  skip-cert-verify: false
  network: tcp
proxy-groups:
- name: SQUAD
  type: select
  proxies:
  - AUTO
  - FAILOVER
  - SQUAD LV 001 vless ca826e
- name: AUTO
  type: url-test
  proxies: &id001
  - SQUAD LV 001 vless ca826e
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
- name: FAILOVER
  type: fallback
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 120
  lazy: true
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- MATCH,SQUAD
